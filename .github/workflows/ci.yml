name: Verificación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec wrangler pages functions build apps/web/functions --outdir /tmp/mm-functions-check
      - run: node scripts/check-budgets.mjs
      - run: pnpm test:backend
      - run: pnpm audit --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config scripts/playwright.config.mjs
      - run: pnpm test:perf
      - name: Build con subida de prueba habilitada
        run: pnpm build
        env:
          PUBLIC_RECETA_UPLOAD_ENABLED: 'true'
          PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
          PUBLIC_RECETAS_RETENTION_DAYS: '30'
      - name: Probar flujo de cotización habilitado
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-reports
          path: |
            artifacts
            scripts/artifacts
            scripts/test-results
          if-no-files-found: ignore
